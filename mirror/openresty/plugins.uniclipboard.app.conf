# OpenResty / Nginx location rules for https://plugins.uniclipboard.app
#
# In 1Panel:
#   1. Create a static website for domain `plugins.uniclipboard.app` with HTTPS enabled.
#   2. Include or paste these rules inside the site's `server { ... }` block.
#   3. Point the site root to `/opt/1panel/apps/openresty/openresty/www/sites/plugins.uniclipboard.app/index`.

autoindex off;
server_tokens off;

if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

# Hide internal sync state / lock / temp files.
location ~ /\. {
    deny all;
    return 404;
}

# Marketplace catalog: short cache so new plugin releases propagate quickly.
location = /registry.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Mirror sync health metadata.
location = /health.json {
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Static commit resolution JSON ({"sha":"<40-hex>"}).
location ^~ /api.github.com/ {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Content-addressed source tarballs pinned by 40-char commit SHA.
location ^~ /codeload.github.com/ {
    default_type application/gzip;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# SHA-256 verified GitHub Release assets pinned by release tag + filename.
location ^~ /github.com/ {
    default_type application/gzip;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
